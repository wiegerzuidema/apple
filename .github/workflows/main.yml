name: MACHINE LOKAAL V3 - VERSIECONTROLE HERSTELD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-lokaal-v3:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Bevestig nieuwe workflow
        run: |
          echo "HERSTELDE WORKFLOW 2026-10-25 ACTIEF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Controleren of de JUISTE lokale iPhone-app aanwezig is
        shell: bash
        run: |
          set -euo pipefail
          test -f iPhone/ios/project.yml || { echo '::error::iPhone/ios/project.yml ontbreekt. Upload de hele iPhone-map naar repository root.'; exit 1; }
          test -f iPhone/ios/MachineRemote/Views.swift || { echo '::error::Views.swift ontbreekt'; exit 1; }
          test -f iPhone/ios/MachineRemote/Assets.xcassets/AppIcon.appiconset/AppIcon.png || { echo '::error::Geel appicoon ontbreekt'; exit 1; }
          grep -Fq 'Machine Remote · LOKAAL v3' iPhone/ios/MachineRemote/Views.swift || { echo '::error::Dit is NIET de lokale v3-app. Bouw afgebroken.'; exit 1; }
          grep -Fq 'nl.wiegerz.machine.remote.localv3' iPhone/ios/project.yml || { echo '::error::Oud bundle-ID gevonden'; exit 1; }
          if grep -Eq 'struct PairView|Eenmalige koppelcode|Veilig koppelen|/machine/api.php' iPhone/ios/MachineRemote/Views.swift; then
            echo '::error::Oude koppelcode-interface gevonden. Bouw afgebroken.'
            exit 1
          fi
          echo 'OK: lokale v3-app zonder koppelcode gevonden'
          sips -g pixelWidth -g pixelHeight iPhone/ios/MachineRemote/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: XcodeGen installeren
        run: brew install xcodegen

      - name: Nieuw iOS-project genereren
        working-directory: iPhone/ios
        run: xcodegen generate

      - name: Nieuwe iPhone-app compileren
        run: >-
          xcodebuild -project iPhone/ios/MachineRemote.xcodeproj -scheme MachineRemote
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Identiteit van gebouwde app controleren
        shell: bash
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/MachineRemote.app
          test -d "$APP" || { echo '::error::Geen .app gegenereerd'; exit 1; }
          DISPLAY=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          echo "Naam: $DISPLAY"; echo "Bundle ID: $BUNDLE"; echo "Versie: $VERSION"
          test "$DISPLAY" = 'Machine Lokaal v3' || { echo '::error::Onjuiste appnaam'; exit 1; }
          test "$BUNDLE" = 'nl.wiegerz.machine.remote.localv3' || { echo '::error::Onjuist bundle-ID'; exit 1; }
          echo "App-versie $VERSION wordt geaccepteerd. Appnaam en bundle-ID blijven verplicht gecontroleerd."
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry MachineLokaal-v3-unsigned.ipa Payload)
          cat > dist/CONTROLEER_DIT_EERST.txt <<EOF
          Correcte app: Machine Lokaal v3
          Bundle-ID: nl.wiegerz.machine.remote.localv3
          Versie: $VERSION
          Geen koppelcode.
          Startscherm: Machine Remote · LOKAAL v3
          Adres: http://192.168.4.1/api
          IPA: MachineLokaal-v3-unsigned.ipa
          EOF

      - name: GECONTROLEERDE v3 IPA downloaden
        uses: actions/upload-artifact@v4
        with:
          name: ALLEEN-MACHINE-LOKAAL-V3-IPA
          path: |
            dist/MachineLokaal-v3-unsigned.ipa
            dist/CONTROLEER_DIT_EERST.txt
          if-no-files-found: error
          retention-days: 14
