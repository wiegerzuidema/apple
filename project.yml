name: MachineRemote
options:
  bundleIdPrefix: nl.wiegerz
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: nl.wiegerz.machine.remote.localv3
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  MachineRemote:
    type: application
    platform: iOS
    sources: [MachineRemote]
    info:
      path: MachineRemote/Info.plist
      properties:
        CFBundleDisplayName: Machine Lokaal v3
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Machine Remote bedient de ESP8266 rechtstreeks via lokale wifi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  MachineRemote:
    build:
      targets:
        MachineRemote: all
